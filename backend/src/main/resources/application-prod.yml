spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: false
  h2:
    console:
      enabled: false

server:
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        # 生产站点仅通过 HTTPS 提供，会话 Cookie 必须带 Secure，避免明文泄露。
        secure: true
        http-only: true
        same-site: lax

