spring:
  application:
    name: shihou-backend
  datasource:
    url: jdbc:h2:mem:shihou;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
    display-name: ${ADMIN_DISPLAY_NAME:平台管理员}
  super-admin:
    username: ${SUPER_ADMIN_USERNAME:}
    password: ${SUPER_ADMIN_PASSWORD:}
    display-name: ${SUPER_ADMIN_DISPLAY_NAME:超级管理员}

management:
  endpoints:
    web:
      exposure:
        include: health,info

shihou:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    fallback-base-url: ${AGENT_FALLBACK_BASE_URL:https://text.pollinations.ai/openai}
    fallback-model: ${AGENT_FALLBACK_MODEL:openai-fast}

