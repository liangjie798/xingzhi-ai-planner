name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - run: pnpm build-storybook
      - run: pnpm build
        env:
          NEXT_PUBLIC_AMAP_KEY: ci-build-placeholder
      - name: Check publishable history
        run: node ../scripts/check-publish.mjs
      - name: Validate Docker Compose
        working-directory: .
        run: docker compose --env-file .env.example config --quiet

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check automatic environment preparation
        shell: powershell
        run: ./scripts/tests/backend-environment.Tests.ps1

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: bash ./mvnw --batch-mode test
